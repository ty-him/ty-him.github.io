<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple JavaScript Calculator</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 30px;
      background-color: #fdfdfd;
      color: #222;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    p.note {
      font-size: 14px;
      color: #555;
      margin-top: 0;
      margin-bottom: 24px;
    }

    /* ---- Table styling (assignment requirement) ---- */
    table {
      border-collapse: collapse;
      border: 3px solid #333;
      margin-bottom: 30px;
      min-width: 420px;
    }

    th, td {
      border: 2px solid #333;
      padding: 8px 18px;
      text-align: center;
      font-size: 16px;
    }

    th {
      background-color: #f5a623;
      color: #000;
      font-weight: bold;
    }

    /* Operator column gets a lighter shade, like the example */
    td.operator {
      background-color: #fbe0b8;
    }

    td.error {
      color: #b00020;
      font-style: italic;
    }

    tr:nth-child(even) td:not(.operator) {
      background-color: #ffffff;
    }

    caption {
      caption-side: top;
      text-align: left;
      font-weight: bold;
      font-size: 18px;
      padding-bottom: 6px;
    }
  </style>
</head>
<body>

  <h1>Simple JavaScript Calculator</h1>
  <p class="note">
    Enter two numbers and an operator when prompted. Click <strong>OK</strong> to keep going,
    or <strong>Cancel</strong> on any prompt to stop and see the summary.
  </p>

  <!-- The entire calculator runs from this external file -->
  <script src="calculator.js"></script>

</body>
</html>
